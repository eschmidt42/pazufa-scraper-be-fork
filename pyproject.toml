[project]
name = "pazufa-scraper-be"
version = "0.0.3"
description = "A scraper that extracts data about the Abgeordnetenhaus von Berlin and supplies it to the PaZuFa."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sebastian Jäger", email = "git@sebastian-jaeger.me" }]
dependencies = [
  "pazufa-corelib>=0.3.1",
  "pydantic>=2.13.4",
  "python-magic>=0.4.27",
  "scrapy>=2.16.0",
  "xberg>=1.0.0",
]

[dependency-groups]
dev = [
  "ipywidgets>=8.1.9",
  "jupyterlab>=4.5.7",
  "jupyterlab-vim>=4.1.4",
  "polars>=2.0.0",
  "prek>=0.4.3",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.15",
  "ty>=0.0.40",
  "types-lxml>=2026.2.16",
]

[tool.coverage.run]
source = ["pazufa_scraper_be"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 160
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
  "ALL",  # Include all the rules, including new ones
]
ignore = [
  "CPY001",  # Copyright info not necessary
  "FIX",  # Temporary developer notes should not break actions
  "COM812",  # For compatibility with ruff-format
  "ISC001",  # For compatibility with ruff-format
  "ISC003",  # Do not implicitly concatenate strings
  "S311",  # We do not require cryptographically-sound randomness
  "D100",  # Do not document public modules
  "D104",  # Do not document public packages
  "TD003",  # Allow TODOs without links
  "S101",  # Allow testing methods
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
  "F401",  # Unused imports in __init__ files can make sense
]
"tests/*" = [
  "SLF001",  # allow private member access
  "DTZ001",  # datetime without tzinfo - intentional for testing
  "DTZ005",  # datetime.now without tz - intentional for testing
  "PLR2004",  # allow magic numbers
  "FBT001",  # allow boolean positional argument
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pazufa_scraper_be"]
